<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>Emanator: project the assistant you want</title>
  <defs>
    <radialGradient id="halo" cx="300" cy="320" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b16cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b16cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" x2="1">
      <stop offset="0" stop-color="#b16cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b16cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="17" x2="50" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#e6d2ff"/>
      <stop offset="1" stop-color="#9a52f5" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#b16cff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#b16cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="#0b0a11"/>
  <rect width="1280" height="640" fill="url(#halo)"/>
  <!-- Emanation: thin rays leaving the mark across the canvas -->
  <rect x="420" y="227" width="860" height="1" fill="url(#ray)"/>
  <rect x="420" y="413" width="860" height="1" fill="url(#ray)"/>
  <g transform="translate(172 192) scale(4)">
    <rect width="64" height="64" rx="15" fill="#13061f"/>
    <rect width="64" height="64" rx="15" fill="none" stroke="#b16cff" stroke-opacity="0.25" stroke-width="0.25"/>
    <rect x="16" y="15" width="6" height="34" rx="3" fill="#ffffff"/>
    <rect x="16" y="15" width="33" height="6" rx="3" fill="url(#beam)"/>
    <rect x="16" y="43" width="33" height="6" rx="3" fill="url(#beam)"/>
    <rect x="16" y="29" width="16" height="6" rx="3" fill="#ffffff"/>
    <circle cx="41" cy="32" r="10" fill="url(#glow)"/>
    <circle cx="41" cy="32" r="4" fill="#b16cff"/>
  </g>
  <g font-family="Geist, 'Helvetica Neue', Arial, sans-serif">
    <text x="520" y="318" font-size="104" font-weight="600" letter-spacing="-3" fill="#ebe7f2">Emanator</text>
    <text x="524" y="378" font-size="34" font-weight="400" fill="#c99cff">Project the assistant you want.</text>
    <text x="524" y="470" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="19" letter-spacing="1" fill="#6a6378">ALWAYS-ON · PROACTIVE · CLAUDE AGENT SDK</text>
  </g>
</svg>
